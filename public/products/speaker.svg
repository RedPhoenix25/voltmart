<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Pulse Mini Speaker</title>
  <desc id="description">Compact blue portable speaker with a fabric grille</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#cfe3ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.6" fill="#bcd5ff" opacity=".7"/>
      <circle cx="14" cy="14" r="2.6" fill="#bcd5ff" opacity=".7"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#1e3a8a" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="140" cy="440" r="100" fill="#fff" opacity=".3"/>
  <path d="M575 90c75 25 116 81 126 154" fill="none" stroke="#fff" stroke-width="25" stroke-linecap="round" opacity=".38"/>
  <g filter="url(#shadow)">
    <rect x="155" y="171" width="490" height="278" rx="98" fill="url(#body)"/>
    <rect x="184" y="193" width="432" height="234" rx="76" fill="#2458b8"/>
    <rect x="205" y="210" width="390" height="200" rx="60" fill="url(#grille)"/>
    <path d="M366 155h68" stroke="#163d8e" stroke-width="13" stroke-linecap="round"/>
    <circle cx="370" cy="310" r="18" fill="#dbeafe" opacity=".9"/>
    <circle cx="430" cy="310" r="18" fill="#dbeafe" opacity=".9"/>
  </g>
</svg>

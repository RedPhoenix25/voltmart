<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Orbit Smartwatch</title>
  <desc id="description">Dark smartwatch showing colourful activity rings</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f7f5"/>
      <stop offset="1" stop-color="#c7ebe7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b3d"/>
      <stop offset="1" stop-color="#090c15"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#1f4a46" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M80 470C210 400 276 520 410 450s220-80 330-20" fill="none" stroke="#fff" stroke-width="26" opacity=".28"/>
  <g filter="url(#shadow)">
    <rect x="330" y="12" width="140" height="195" rx="54" fill="#34394b"/>
    <rect x="330" y="393" width="140" height="195" rx="54" fill="#34394b"/>
    <rect x="245" y="126" width="310" height="350" rx="84" fill="#1a1e2b"/>
    <rect x="268" y="149" width="264" height="304" rx="63" fill="url(#screen)"/>
    <circle cx="400" cy="293" r="75" fill="none" stroke="#5eead4" stroke-width="24" stroke-dasharray="350 121" stroke-linecap="round" transform="rotate(-90 400 293)"/>
    <circle cx="400" cy="293" r="48" fill="none" stroke="#818cf8" stroke-width="18" stroke-dasharray="220 82" stroke-linecap="round" transform="rotate(-55 400 293)"/>
    <circle cx="400" cy="293" r="22" fill="none" stroke="#fbbf24" stroke-width="12" stroke-dasharray="88 50" stroke-linecap="round"/>
    <circle cx="568" cy="256" r="17" fill="#252a38"/>
  </g>
</svg>

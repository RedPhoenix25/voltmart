    <rect x="198" y="280" width="138" height="222" rx="62" fill="#2b2741"/>
    <rect x="464" y="280" width="138" height="222" rx="62" fill="#2b2741"/>
    <rect x="219" y="300" width="92" height="180" rx="44" fill="url(#band)"/>
    <rect x="489" y="300" width="92" height="180" rx="44" fill="url(#band)"/>
    <path d="M239 345h52M509 345h52" stroke="#bcb7ff" stroke-width="10" stroke-linecap="round" opacity=".7"/>
